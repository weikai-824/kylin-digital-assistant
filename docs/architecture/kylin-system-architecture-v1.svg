  <text x="1630" y="643" class="small">Milvus + ES 双路召回，RRF</text>
  <text x="1630" y="666" class="small">融合后必须经过 Rerank；无真实</text>
  <text x="1630" y="689" class="small">相关度时按无证据拒答并建单。</text>
  <text x="1630" y="722" class="tiny">检索故障不伪装成“没有答案”</text>

