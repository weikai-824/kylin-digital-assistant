  <text x="1630" y="470" class="small">具体 SDK、数据库和检索实现</text>
  <text x="1630" y="493" class="small">留在 outbound adapters。</text>
  <text x="1630" y="526" class="tiny">架构守卫 + 核心逻辑：16 项通过</text>

  <rect x="1612" y="568" width="254" height="178" rx="14" fill="#F0FAF1"/>
