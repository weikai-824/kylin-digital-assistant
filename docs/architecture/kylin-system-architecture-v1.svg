<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1320" viewBox="0 0 1920 1320" role="img" aria-labelledby="title desc">
  <title id="title">麒麟信安数字人系统架构（AS-IS V1）</title>
  <desc id="desc">基于当前代码仓库绘制的系统咨询数字助手架构图，展示入口、入站适配器、组合根、应用服务、端口、模型能力、数据基础设施与主要业务链路。</desc>
  <defs>
    <linearGradient id="codeRail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1746A2"/>
      <stop offset="1" stop-color="#2F7DE1"/>
    </linearGradient>
    <linearGradient id="modelRail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#087E75"/>
      <stop offset="1" stop-color="#16A394"/>
    </linearGradient>
    <linearGradient id="dataRail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23763D"/>
      <stop offset="1" stop-color="#43A65B"/>
    </linearGradient>
    <linearGradient id="softBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF5FF"/>
    </linearGradient>
    <linearGradient id="softTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EBFAF7"/>
    </linearGradient>
    <linearGradient id="softGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0FAF1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F274C" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2868CC"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#159353"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97706"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C4DDA"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; fill: #10203B; }
      .title { font-size: 42px; font-weight: 800; letter-spacing: 2px; }
      .subtitle { font-size: 19px; fill: #516178; }
      .section { font-size: 25px; font-weight: 750; }
      .label { font-size: 19px; font-weight: 700; }
      .small { font-size: 15px; fill: #526279; }
      .tiny { font-size: 13px; fill: #64748B; }
      .rail { font-size: 30px; font-weight: 800; fill: white; }
      .rail-en { font-size: 25px; font-weight: 700; fill: white; opacity: .96; }
      .box-blue { fill: url(#softBlue); stroke: #2C67C9; stroke-width: 1.8; }
      .box-teal { fill: url(#softTeal); stroke: #138E82; stroke-width: 1.8; }
      .box-green { fill: url(#softGreen); stroke: #2F914D; stroke-width: 1.8; }
      .box-orange { fill: #FFF8EC; stroke: #D98A18; stroke-width: 1.8; }
      .box-purple { fill: #FAF7FF; stroke: #7C4DDA; stroke-width: 1.8; }
      .chip-blue { fill: #EDF4FF; stroke: #A8C5F2; }
      .chip-teal { fill: #EAF8F6; stroke: #93D5CC; }
      .chip-orange { fill: #FFF5E5; stroke: #F3C77A; }
      .flow-blue { fill: none; stroke: #2868CC; stroke-width: 2.2; marker-end: url(#arrowBlue); }
      .flow-green { fill: none; stroke: #159353; stroke-width: 2.2; marker-end: url(#arrowGreen); }
      .flow-orange { fill: none; stroke: #D97706; stroke-width: 2.2; marker-end: url(#arrowOrange); }
      .flow-purple { fill: none; stroke: #7C4DDA; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrowPurple); }
      .muted-line { fill: none; stroke: #8DA1BC; stroke-width: 1.7; marker-end: url(#arrowBlue); opacity: .75; }
    </style>
