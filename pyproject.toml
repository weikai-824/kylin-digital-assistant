[tool.poetry]
name = "kylin-server"
version = "0.1.0"
description = "麒麟信安数字人系统服务端：企业内网知识库 RAG 问答与知识缺口工单。"
authors = ["kylin"]
readme = "README.md"
packages = [
    {include = "kylin"},
]

[tool.poetry.scripts]
kylin = 'kylin.cli:main'

[tool.poetry.dependencies]
# py3.12 已实测可用（docling 解析 + 全量测试通过），不再限制 <3.12
python = ">=3.10,<3.13"
# P7:langchain 全家已移除(Document dataclass 化 / ChatLLM openai SDK 直连)
openai = "1.109.1"
fastapi = "0.109.2"
sse_starlette = "1.8.2"
uvicorn = "0.27.0.post1"
click = "8.1.8"
httpx = {version = "0.28.1", extras = ["brotli", "http2", "socks"]}
python-multipart = "0.0.9"
pydantic = "2.11.1"
# py3.12 适配：docling-core 2.91+ 要求 pydantic-settings>=2.14，原钉的 2.3.4 无法解析
pydantic_settings = "2.15.0"
requests = "2.32.3"
tqdm = "4.66.1"
SQLAlchemy = "2.0.25"
pymysql = "1.1.1"
pymilvus = "2.4.10"
elasticsearch = "8.11.1"
# marshmallow 4 移除 __version_info__，会与 environs<=9.5（旧 pymilvus）冲突；显式钉 3.26.1
marshmallow = "3.26.1"
docling = "2.120.1"
# transformers 5.x 与 docling 2.120 不兼容（layout 推理报 NameError: torch），锁 4.x
transformers = "^4.46"
# Docling PDF 解析（CPU）：torch 需从 PyTorch 官方 CPU 源安装，见 requirements.txt
torch = "2.5.1"
torchvision = "0.20.1"
onnxruntime = "1.19.2"
rapidocr = "3.9.2"
opencv-python = "4.10.0.84"
PyMuPDF = "1.23.16"
openpyxl = "3.1.5"
python-docx = "1.2.0"
# py3.12 适配：1.24.4 无 cp312 wheel（源码编译会失败），1.26.4 为 3.10~3.12 全兼容
numpy = "1.26.4"
# 批次1：8501 从 Streamlit 迁 NiceGUI（调试台）。1.4.34 与 fastapi==0.109.2 兼容
# （自身约束 fastapi<0.110.0,>=0.109.1）；2.x/3.x 要求 starlette>=0.45，与
# fastapi 0.109.2 传递依赖 starlette<0.36 死锁。批次 3 移除 streamlit 系。
nicegui = "1.4.34"
streamlit = "1.36.0"
streamlit-antd-components = "0.3.1"
streamlit-chatbox = "1.1.12.post4"
streamlit-aggrid = "1.0.5"
streamlit-extras = "0.4.2"
pandas = "2.1.4"
# pyarrow 显式钉住 15.0.2：streamlit-antd-components 依赖它；
# 新版 25.x 在本机被 Windows 应用控制策略拦截 DLL 无法加载，15.0.2 实测可用
pyarrow = "15.0.2"
# cryptography：MySQL 8 默认 caching_sha2_password 认证，pymysql 连接必需；
# 另用于 OA token 缓存的 Fernet 加密（refresh_token 不明文落盘），勿删
cryptography = "50.0.1"
xinference_client = { version = "^0.13.0", optional = true }
zhipuai = { version = "^2.1.0", optional = true }
memoization = "0.4.0"
ruamel_yaml = "0.18.6"
loguru = "0.7.2"
langfuse = "4.15.1"
# Home migration: protobuf shared by legacy UI and OpenTelemetry.
protobuf = "5.29.6"
googleapis-common-protos = "1.70.0"

[tool.poetry.extras]
xinference = ["xinference_client"]
zhipuai = ["zhipuai"]
# ollama 未在 dependencies 声明，无法作为合法 extra，已移除；需要时先补依赖声明

# An extra used to be able to add extended testing.
# Please use new-line on formatting to make it easier to add new packages without
# merge-conflicts
extended_testing = []

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
# The only dependencies that should be added are
# dependencies used for running tests (e.g., pytest, freezegun, response).
# Any dependencies that do not meet that criteria will be removed.
pytest = "^7.3.0"
pytest-cov = "^4.0.0"
pytest-dotenv = "^0.5.2"
duckdb-engine = "^0.9.2"
pytest-watcher = "^0.2.6"
freezegun = "^1.2.2"
responses = "^0.22.0"
pytest-asyncio = "^0.23.2"
lark = "^1.1.5"
pytest-mock = "^3.10.0"
pytest-socket = "^0.6.0"
syrupy = "^4.0.2"
requests-mock = "^1.11.0"


[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = "^0.1.5"


[tool.poetry.group.codespell]
optional = true

[tool.poetry.group.codespell.dependencies]
codespell = "^2.2.0"


[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
jupyter = "^1.0.0"
setuptools = "^67.6.1"



[tool.ruff]
exclude = [
    "tests/examples/non-utf8-encoding.py",
    "tests/integration_tests/examples/non-utf8-encoding.py",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "T201", # print
]

[tool.mypy]
ignore_missing_imports = "True"
disallow_untyped_defs = "True"
exclude = ["notebooks", "examples", "example_data"]

[tool.coverage.run]
omit = [
    "tests/*",
]

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-plugin-pypi-mirror==0.4.2"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# --strict-markers will raise errors on unknown marks.
# https://docs.pytest.org/en/7.1.x/how-to/mark.html#raising-errors-on-unknown-marks
#
# https://docs.pytest.org/en/7.1.x/reference/reference.html
# --strict-config       any warnings encountered while parsing the `pytest`
#                       section of the configuration file raise errors.
#
# https://github.com/tophat/syrupy
# --snapshot-warn-unused    Prints a warning on unused snapshots rather than fail the test suite.
addopts = "--strict-markers --strict-config --durations=5 --snapshot-warn-unused -svv"
# Registering custom markers.
# https://docs.pytest.org/en/7.1.x/example/markers.html#registering-markers
markers = [
    "requires: mark tests as requiring a specific library",
    "scheduled: mark tests to run in scheduled testing",
    "compile: mark placeholder test used to compile integration tests without running them"
]
asyncio_mode = "auto"


[tool.codespell]
skip = '.git,*.pdf,*.svg,*.pdf,*.yaml,*.ipynb,poetry.lock,*.min.js,*.css,package-lock.json,example_data,_dist,examples,*.trig,*.json,*.md,*.html,*.txt,*.csv'
# Ignore latin etc
ignore-regex = '.*(Stati Uniti|Tense=Pres).*'
# whats is a typo but used frequently in queries so kept as is
# aapply - async apply
# unsecure - typo but part of API, decided to not bother for now
ignore-words-list = 'momento,collison,ned,foor,reworkd,parth,whats,aapply,mysogyny,unsecure,damon,crate,aadd,symbl,precesses,accademia,nin'

[tool.poetry.plugins.dotenv]
ignore = "false"
dotenv = "dotenv:plugin"


# https://python-poetry.org/docs/repositories/
[[tool.poetry.source]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"
